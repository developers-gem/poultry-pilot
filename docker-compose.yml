# Local development database: MongoDB 7 as a single-node replica set.
# A replica set is required because the API uses multi-document transactions.
#   docker compose up -d mongo        start
#   docker compose ps                 wait for "healthy"
#   docker compose down               stop (data kept in the mongo-data volume)
#   docker compose down -v            stop and delete all local data
services:
  mongo:
    image: mongo:7.0
    container_name: poultrypilot-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it is PRIMARY.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20
    restart: unless-stopped

  # Optional: run the API in Docker too.  docker compose --profile api up -d
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: services/api/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/poultrypilot?replicaSet=rs0&directConnection=true
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
