name: ci
on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Start MongoDB 7 as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "rs.status().myState" | grep -q 1 && break; sleep 1; done
      - name: Tests (including real MongoDB connectivity)
        run: pnpm test
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/pp_test?replicaSet=rs0&directConnection=true
      - run: pnpm openapi
      - run: pnpm --filter @poultrypilot/api build
      - name: Every index builds on real MongoDB (the same command production runs before traffic)
        run: node services/api/dist/create-indexes.js
        env:
          MONGODB_URI: mongodb://localhost:27017/pp_indexes?replicaSet=rs0&directConnection=true
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - run: pnpm --filter @poultrypilot/web build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: flutter --version
      - run: flutter pub get
      - name: Generate code (Freezed, json_serializable, Drift)
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos
      - name: Tests (models against fixtures captured from the real API, interceptor, router, session, cache)
        run: flutter test
      - name: Compile a real Android build
        run: |
          flutter create --platforms=android --project-name poultrypilot_mobile --org com.poultrypilot .
          flutter build apk --debug --dart-define-from-file=config/dev.example.json
