name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @poultrypilot/api build
  # TODO(Phase 1 exit): add a job that runs the API suite against a real MongoDB replica set
  # by swapping the memory adapter for createMongoRepositories() in the test harness.
